<head>

      .contact-mail {
        cursor: pointer;

</head>
<body>
    <h1>Ergotherapiepraxis Juliane Hube</h1>

    <p>
        Lehnitzstraße 21a<br>
        16515 Oranienburg
    </p>

    <p>
        Telefon: <a href="tel:+4933015736930">03301 / 573 69 30</a> oder <a href="tel:+4933015736931">03301 / 573 69 31</a><br>
        Fax: 03301 / 573 69 32
    </p>

    <p>
        E-Mail: <span id="mail" class="contact-mail" aria-label="E-Mail-Adresse anzeigen"></span>
    </p>

<script>
  const key = "G+X:Aw.~zrZDd&OI=E3LS/=7=p$B7&UZ";
  const ciphertext = "U2FsdGVkX18bgElAL3A+AK53zaJ1tNn4M6xbbxb3l2u0PsTivQ6pSzMDkLSbYg17";

  function revealEmail() {
    try {
      const bytes = CryptoJS.AES.decrypt(ciphertext, key);
      const email = bytes.toString(CryptoJS.enc.Utf8);

      if (!email) {
        console.error("Entschlüsselung fehlgeschlagen");
        return;
      }

      const span = document.getElementById("mail");
      span.textContent = email;
      span.setAttribute("aria-label", "E-Mail-Adresse: " + email);

      // Klickbar machen
      span.onclick = function () {
        window.location.href = "mailto:" + email;
      };
    } catch (e) {
      console.error("Fehler bei AES-Entschlüsselung:", e);
    }
  }

  // Variante A: direkt beim Laden anzeigen
  revealEmail();

  // Variante B: nur nach Klick anzeigen (falls du es härter machen willst)
  // document.getElementById("mail").textContent = "E‑Mail anzeigen";
  // document.getElementById("mail").onclick = revealEmail;
</script>

</body>
